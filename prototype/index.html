<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCD Store</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="desktop">
  <div class="aurora" aria-hidden="true"></div>

  <!-- ── Menubar ─────────────────────────────────────────── -->
  <div class="menubar">
    <button class="mb-apple" title="Apple">
      <svg viewBox="0 0 20 24" width="13" height="16" aria-hidden="true">
        <path fill="currentColor" d="M13.9 12.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.7-.4 6.6 1.1 8.8.7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7 1.9-1.1 2.6-2.1c.8-1.2 1.2-2.4 1.2-2.4s-2.3-.9-2.2-3.5M11.7 5.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2"/>
      </svg>
    </button>
    <span class="mb-item mb-strong" id="mbAppName">TCD Store</span>
    <span class="mb-item">File</span>
    <span class="mb-item">Edit</span>
    <span class="mb-item">View</span>
    <span class="mb-item">Packages</span>
    <span class="mb-item">Window</span>
    <span class="mb-item">Help</span>
    <span class="mb-spacer"></span>
    <span class="mb-item mb-dim" id="mbClock">Tue 10:32 AM</span>
  </div>

  <!-- ── Window ──────────────────────────────────────────── -->
  <div class="stage">
    <div class="window" id="window">

      <div class="titlebar">
        <div class="lights">
          <span class="light close"></span>
          <span class="light min"></span>
          <span class="light zoom"></span>
        </div>
        <div class="title" id="winTitle">TCD Store</div>
        <div class="titlebar-tools">
          <button class="tb-btn" id="btnBack" title="Back" disabled>
            <svg viewBox="0 0 16 16" width="13" height="13"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tb-btn" id="btnReload" title="Refresh Sources">
            <svg viewBox="0 0 16 16" width="13" height="13"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="searchbox" id="searchWrap">
          <svg class="search-ico" viewBox="0 0 16 16" width="12" height="12"><circle cx="6.8" cy="6.8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.1 10.1 L13.4 13.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search TCD Store" spellcheck="false" autocomplete="off">
          <button class="search-clear" id="searchClear" hidden aria-label="Clear search">×</button>
        </div>
        <div class="toolbar-right">
          <button class="seg" id="btnUpdateAll" hidden>
            <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 2.5V10m0 0L5 7m3 3 3-3M3.5 13.2h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Update All
          </button>
        </div>
      </div>

      <div class="split">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="content"></main>
      </div>

      <div class="statusbar" id="statusbar"></div>
    </div>
  </div>

  <div class="overlays" id="overlays"></div>

  <!-- ── Dock ────────────────────────────────────────────── -->
  <div class="dock" aria-hidden="true">
    <div class="dock-item"><svg viewBox="0 0 24 24" width="44" height="44"><rect x="2" y="3" width="20" height="18" rx="3" fill="#5b9bee"/><rect x="4.5" y="5.5" width="15" height="12" rx="1.5" fill="rgba(255,255,255,.85)"/><path d="M4.5 6.5 20 17" stroke="#3875d7" stroke-width="1.6"/></svg></div>
    <div class="dock-item"><svg viewBox="0 0 24 24" width="44" height="44"><circle cx="12" cy="12" r="9" fill="#b9c2cd"/><path d="M12 3a9 9 0 0 1 0 18" fill="#9aa5b3"/></svg></div>
    <div class="dock-sep"></div>
    <div class="dock-item dock-active" id="dockTcd"><svg viewBox="0 0 24 24" width="44" height="44"><rect x="2" y="2" width="20" height="20" rx="5" fill="#3875d7"/><path d="M8 8h8v8H8z" fill="none" stroke="#fff" stroke-width="1.8" rx="1"/><path d="M6 12h12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <div class="dock-item"><svg viewBox="0 0 24 24" width="44" height="44"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="#3a3a3a"/><path d="M3 9h18" stroke="#777" stroke-width="1"/><rect x="9" y="6" width="6" height="1.6" rx=".8" fill="#c33"/></svg></div>
    <div class="dock-item"><svg viewBox="0 0 24 24" width="44" height="44"><rect x="2" y="5" width="20" height="14" rx="2" fill="#2b3a45"/><rect x="4.5" y="7.5" width="15" height="9" rx="1" fill="#5ec8d8"/></svg></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
